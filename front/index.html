<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine · Loja de Roupas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <img src="img/logo.svg" alt="Logotipo da Loja de Roupas: uma camiseta" width="48" height="48">
    <p>Loja de Roupas</p>
    <nav aria-label="Principal">
      <a href="index.html" aria-current="page">Vitrine</a>
      <a href="cadastro.html">Cadastrar produto</a>
    </nav>
  </header>
  <main>
    <h1>Vitrine</h1>
    <p>Promoção da semana: 10% no carrinho. Frete grátis a partir de R$ 200 após o desconto.</p>
    <label for="busca">Buscar produto pelo nome</label>
    <input id="busca" type="search" placeholder="Ex.: camiseta">
    <section aria-labelledby="titulo-produtos">
      <h2 id="titulo-produtos">Produtos</h2>
      <p id="estado" role="status"></p>
      <div id="vitrine" class="grade"></div>
    </section>
  </main>
  <footer>Loja de Roupas · Projeto acadêmico · Senac Pernambuco · 2026.2</footer>
  <script src="app.js"></script>
</body>
</html>
